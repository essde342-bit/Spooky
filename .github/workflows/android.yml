name: Build optimized LimeRoot APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build optimized release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK and report size
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          PERMISSIONS="$("$AAPT" dump permissions "$APK")"
          echo "$PERMISSIONS"
          if echo "$PERMISSIONS" | grep -q 'uses-permission:'; then
            echo "Unexpected Android permissions found." >&2
            exit 1
          fi
          echo "### LimeRoot APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK archive integrity: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Declared Android permissions: none" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: limeroot-0.3.0-optimized
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
