name: Build and test LimeRoot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run report tests and build optimized release APK
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify APK, signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -t "$APK" >/dev/null

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          PERMISSIONS="$("$AAPT" dump permissions "$APK")"
          echo "$PERMISSIONS"

          UNEXPECTED="$(echo "$PERMISSIONS" | grep 'uses-permission:' | grep -v "dev.limeroot.research.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected Android permissions found:" >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          echo "### LimeRoot 0.4.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK archive integrity: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK signature: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unexpected Android permissions: none" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: limeroot-0.4.0-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
